    <rect x="772" y="406" width="172" height="132" rx="7" fill="#241f3a" fill-opacity="0.62"/>
    <text x="780" y="420" font-size="7.5" font-weight="700" letter-spacing="0.5" fill="#9dc0ff">SISTEMA</text>
    <text x="780" y="433" font-size="8.5" fill="#a7a4c4">Equipo</text>
    <text x="828" y="433" font-size="8.5" fill="#e4e2f5">MacBook de Juan</text>
    <text x="780" y="446" font-size="8.5" fill="#a7a4c4">SO</text>
    <text x="828" y="446" font-size="8.5" fill="#e4e2f5">macOS Sonoma 14.5</text>

    <text x="780" y="463" font-size="7.5" font-weight="700" letter-spacing="0.5" fill="#9dc0ff">HARDWARE</text>
    <text x="780" y="479" font-size="8.5" fill="#a7a4c4">RAM</text>
    <rect x="828" y="473" width="100" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="828" y="473" width="45" height="5" rx="2.5" fill="#5b93ff"/>
    <text x="780" y="493" font-size="8.5" fill="#a7a4c4">Batería</text>
    <rect x="828" y="487" width="100" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="828" y="487" width="82" height="5" rx="2.5" fill="#5b93ff"/>

    <text x="780" y="510" font-size="7.5" font-weight="700" letter-spacing="0.5" fill="#9dc0ff">RED</text>
    <text x="780" y="523" font-size="8.5" fill="#a7a4c4">Wi-Fi</text>
    <text x="828" y="523" font-size="8.5" fill="#e4e2f5">Cafe-Wifi-5G</text>
    <text x="780" y="536" font-size="8.5" fill="#a7a4c4">IP Pública</text>
    <text x="828" y="536" font-size="8.5" fill="#e4e2f5">203.0.113.42</text>
  </g>

  <!-- dock -->
  <g>
    <rect x="325" y="544" width="310" height="48" rx="16" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect x="333" y="550" width="34" height="34" rx="9" fill="#4a9eff"/>
    <rect x="375" y="550" width="34" height="34" rx="9" fill="#3ddc84"/>
    <rect x="417" y="550" width="34" height="34" rx="9" fill="#ff6b6b"/>
    <rect x="459" y="550" width="34" height="34" rx="9" fill="#a066ff"/>
    <rect x="501" y="550" width="34" height="34" rx="9" fill="#ffb648"/>
    <rect x="543" y="550" width="34" height="34" rx="9" fill="#6b7280"/>
    <rect x="585" y="553" width="1" height="30" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="593" y="550" width="34" height="34" rx="9" fill="#9aa0ac"/>
