<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="BGInfoMac menu bar popover example with fictitious data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2560"/>
      <stop offset="100%" stop-color="#171335"/>
    </linearGradient>
    <radialGradient id="blob1" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#ffb48c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffb48c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#ff78aa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff78aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="30%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#785aff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#785aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob4" cx="80%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#50b4ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#50b4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="600" rx="14" fill="url(#bg)"/>
  <rect width="960" height="600" rx="14" fill="url(#blob1)"/>
  <rect width="960" height="600" rx="14" fill="url(#blob2)"/>
  <rect width="960" height="600" rx="14" fill="url(#blob3)"/>
  <rect width="960" height="600" rx="14" fill="url(#blob4)"/>

  <!-- menu bar -->
  <rect x="0" y="0" width="960" height="26" fill="#14141a" fill-opacity="0.55"/>
  <circle cx="18" cy="13" r="4" fill="#ffffff" fill-opacity="0.9"/>
  <text x="32" y="17" font-size="11" fill="#ffffff" fill-opacity="0.9">Finder&#160;&#160;&#160;File&#160;&#160;&#160;Edit&#160;&#160;&#160;View&#160;&#160;&#160;Go&#160;&#160;&#160;Window&#160;&#160;&#160;Help</text>

  <!-- BGInfoMac status icon, highlighted (active) -->
  <rect x="893" y="4" width="16" height="18" rx="4" fill="#ffffff" fill-opacity="0.22"/>
  <path d="M900 6 l3 8 h-2 l1 6 -5 -9 h2 z" fill="#ffe08a"/>

  <path d="M922 8 a7 7 0 0 1 10 0" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M924.3 11 a4 4 0 0 1 5.4 0" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <circle cx="927" cy="15" r="1.2" fill="#ffffff"/>
  <rect x="944" y="8" width="12" height="7" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.1"/>
  <rect x="956" y="10.5" width="1.6" height="2" fill="#ffffff"/>
  <rect x="945" y="9" width="8.5" height="5" rx="0.8" fill="#ffffff"/>
  <text x="808" y="17" font-size="11" fill="#ffffff" text-anchor="end">Mon 22 Aug 14:32</text>

  <!-- popover arrow -->
  <rect x="895" y="26" width="12" height="12" transform="rotate(45 901 32)" fill="#2c2a3d"/>

  <!-- popover -->
  <g>
    <rect x="754" y="31" width="190" height="196" rx="9" fill="#2c2a3d"/>
    <text x="764" y="47" font-size="8" font-weight="700" letter-spacing="0.5" fill="#9dc0ff">SISTEMA</text>
    <text x="764" y="60" font-size="9" fill="#a7a4c4">Equipo</text>
    <text x="820" y="60" font-size="9" fill="#e4e2f5">MacBook de Juan</text>
    <text x="764" y="73" font-size="9" fill="#a7a4c4">SO</text>
    <text x="820" y="73" font-size="9" fill="#e4e2f5">macOS Sonoma 14.5</text>

    <text x="764" y="90" font-size="8" font-weight="700" letter-spacing="0.5" fill="#9dc0ff">HARDWARE</text>
    <text x="764" y="106" font-size="9" fill="#a7a4c4">RAM</text>
    <rect x="820" y="100" width="106" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="820" y="100" width="48" height="5" rx="2.5" fill="#5b93ff"/>
    <text x="764" y="120" font-size="9" fill="#a7a4c4">Batería</text>
    <rect x="820" y="114" width="106" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="820" y="114" width="87" height="5" rx="2.5" fill="#5b93ff"/>

    <text x="764" y="137" font-size="8" font-weight="700" letter-spacing="0.5" fill="#9dc0ff">ALMACENAMIENTO</text>
    <text x="764" y="153" font-size="9" fill="#a7a4c4">Macintosh HD</text>
    <rect x="820" y="147" width="106" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="820" y="147" width="64" height="5" rx="2.5" fill="#5b93ff"/>

    <text x="764" y="170" font-size="8" font-weight="700" letter-spacing="0.5" fill="#9dc0ff">RED</text>
    <text x="764" y="183" font-size="9" fill="#a7a4c4">Wi-Fi</text>
    <text x="820" y="183" font-size="9" fill="#e4e2f5">Cafe-Wifi-5G</text>
    <rect x="764" y="190" width="170" height="1" fill="#ffffff" fill-opacity="0.18"/>
    <text x="764" y="202" font-size="9" fill="#a7a4c4">VPN</text>
    <text x="820" y="202" font-size="9" fill="#e4e2f5">NordVPN</text>
    <text x="764" y="214" font-size="9" fill="#a7a4c4">IP Pública</text>
    <text x="820" y="214" font-size="9" fill="#e4e2f5">203.0.113.42</text>
    <text x="764" y="226" font-size="9" fill="#a7a4c4">Proveedor</text>
    <text x="820" y="226" font-size="9" fill="#e4e2f5">Fictional Broadband</text>
  </g>

  <!-- dock -->
  <g>
    <rect x="325" y="544" width="310" height="48" rx="16" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.25"/>
    <rect x="333" y="550" width="34" height="34" rx="9" fill="#4a9eff"/>
    <rect x="375" y="550" width="34" height="34" rx="9" fill="#3ddc84"/>
    <rect x="417" y="550" width="34" height="34" rx="9" fill="#ff6b6b"/>
    <rect x="459" y="550" width="34" height="34" rx="9" fill="#a066ff"/>
    <rect x="501" y="550" width="34" height="34" rx="9" fill="#ffb648"/>
    <rect x="543" y="550" width="34" height="34" rx="9" fill="#6b7280"/>
    <rect x="585" y="553" width="1" height="30" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="593" y="550" width="34" height="34" rx="9" fill="#9aa0ac"/>
  </g>
</svg>
